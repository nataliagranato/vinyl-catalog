name = "vinyl-catalog-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Disable workers.dev for production (using custom domain)
workers_dev = false
preview_urls = false

# Account configuration
account_id = "4839c9636a58fa9490bbe3d2e686ad98"

# Custom domain configuration
[[routes]]
pattern = "vinyl-catalog-api.nataliagranato.xyz"
custom_domain = true

# Observability - Workers Logs and Traces enabled
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0
# OpenTelemetry export for logs (configure destination in Cloudflare dashboard first)
# destinations = ["logs-destination-name"]
# persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
# OpenTelemetry export for traces (configure destination in Cloudflare dashboard first)
# destinations = ["tracing-destination-name"]
# persist = true

# Database binding
[[d1_databases]]
binding = "DB"
database_name = "vinyl-catalog-db"
database_id = "15bccaf5-b348-4b30-91b8-d0bd22754ac0"

# R2 storage binding for file uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "vinyl-catalog-uploads"

# Environment variables
[vars]
APP_ENV = "production"
JWT_EXPIRATION_HOURS = "24"
ADMIN_USERNAME = "admin"

# SECURE SECRETS (Generated for production)
# These are cryptographically secure random values
# TODO: Move to Cloudflare Secrets when the API is available
# Current limitation: Cloudflare Secrets API had conflicts
# Alternative: Use wrangler secret put (requires manual setup)
JWT_SECRET = "FkPWJp/9m85INQhCIzUNT/B92vS7G+T/bPCrA5WUVmY="
ADMIN_PASSWORD = "TWTO/VsWHuV+IuKlYXsZTw=="

# Dev configuration
[dev]
port = 8787
local_protocol = "http"