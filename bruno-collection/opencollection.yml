opencollection: 1.0.0

info:
  name: Vinyl Catalog API

config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: base_url
      value: http://localhost:8787
    - name: api_version
      value: v1

bundled: false
extensions:
  ignore:
    - node_modules
    - .git
