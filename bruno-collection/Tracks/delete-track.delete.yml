info:
  name: Delete Track
  type: http
  seq: 14

http:
  method: DELETE
  url: "{{base_url}}/api/{{api_version}}/vinyls/{{vinyl_id}}/tracks/{{track_id}}"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Deletes track successfully", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Remove a track from a vinyl record

  Authentication: Required
  Params:
  - vinyl_id: UUID of the vinyl record
  - track_id: UUID of the track
