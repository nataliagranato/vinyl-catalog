info:
  name: Update Track
  type: http
  seq: 13

http:
  method: PUT
  url: "{{base_url}}/api/{{api_version}}/vinyls/{{vinyl_id}}/tracks/{{track_id}}"
  body:
    type: json
    data: |-
      {
        "title": "Speak to Me (Instrumental)",
        "duration": "1:35"
      }
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Updates track successfully", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Update an existing track within a vinyl record

  Authentication: Required
  Params:
  - vinyl_id: UUID of the vinyl record
  - track_id: UUID of the track
