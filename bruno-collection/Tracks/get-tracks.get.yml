info:
  name: Get Tracks
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}/api/{{api_version}}/vinyls/{{vinyl_id}}/tracks"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns array of tracks", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieve all tracks associated with a specific vinyl record

  Authentication: Required
  Params:
  - vinyl_id: UUID of the vinyl record
