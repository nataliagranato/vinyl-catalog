info:
  name: Get Vinyl by ID
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/api/{{api_version}}/vinyls/{{vinyl_id}}"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns vinyl details", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.have.property("id");
          expect(body).to.have.property("title");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieve a specific vinyl record by its unique identifier

  Authentication: Required
  Params:
  - vinyl_id: UUID of the vinyl record
