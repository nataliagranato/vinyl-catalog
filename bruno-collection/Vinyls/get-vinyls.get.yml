info:
  name: Get All Vinyls
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/{{api_version}}/vinyls"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns array of vinyls", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieve a list of all vinyl records in the catalog

  Authentication: Required
