info:
  name: Toggle Favorite
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/api/{{api_version}}/vinyls/{{vinyl_id}}/favorite"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Toggles favorite successfully", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.have.property("favorite");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Toggle the favorite status of a vinyl record

  Authentication: Required
  Params:
  - vinyl_id: UUID of the vinyl record
