info:
  name: Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/{{api_version}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "TWTO/VsWHuV+IuKlYXsZTw=="
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = typeof res.getBody === 'function' ? res.getBody() : res.body;
        const token = body?.token;
        if (token) {
          bru.setEnvVar("jwt_token", token);
          bru.setVar("jwt_token", token);
        }
    - type: tests
      code: |-
        test("Login successful", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.have.property("token");
        });

        test("Token is valid JWT", function() {
          const body = res.getBody();
          const token = body.token;
          expect(token).to.be.a("string");
          expect(token).to.match(/^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Authenticate user and return JWT token for subsequent requests

  Save the token from response to use in authenticated requests as `jwt_token`.
