info:
  name: Update Profile
  type: http
  seq: 16

http:
  method: PUT
  url: "{{base_url}}/api/{{api_version}}/profile"
  body:
    type: json
    data: |-
      {
        "username": "vinylcollector",
        "bio": "Passionate vinyl record collector and music enthusiast"
      }
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Updates profile successfully", function() {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Update the user profile information

  Authentication: Required
