info:
  name: Health Check
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/{{api_version}}/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Health check endpoint with database and storage connectivity verification

  Expected response:
  - status: ok
  - services.database: connected
  - services.storage: connected
  - services.api: operational
