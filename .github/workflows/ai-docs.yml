name: Documentação com IA

on:
  workflow_dispatch:

permissions:
  contents: write      # push da branch ai/docs
  pull-requests: write # abrir o PR

jobs:
  ai-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gerar documentação e abrir PR
        uses: Tech-Preta/actions/ai-docs@v1
        with:
          prompt-file: .github/ai-docs-prompt.md
          target-branch: main
          allowed-output-paths: |
            docs/adr/ADR-001-decisoes-arquiteturais.md
            docs/runbooks/runbook.md
            docs/ai-analysis.md
            README.md
            docs/swagger/swagger.yaml
        env:
          VERBOO_API_KEY: ${{ secrets.VERBOO_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
